services:
  mboker-img:
    build: .
    container_name: mboker-img
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-4321}:4321"
    volumes:
      - "${DOCKER_DATA_DIR:-D:/Docker/mboker-img/data}:/app/data"
      - "${DOCKER_BACKUP_DIR:-D:/Docker/mboker-img/backups}:/app/backups"
